<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Mirror · an agent using it</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
  #head { position: fixed; left: 3.2vw; top: 4.5vh; z-index: 3; }
  #head h2 { margin: 0; font-weight: 200; font-size: clamp(26px, 3.6vw, 62px); letter-spacing: -0.02em; line-height: 1.04; }
  #head p { margin: 8px 0 0; font-size: clamp(12px, 1.15vw, 18px); color: var(--ink-soft); }
  #log { position: fixed; left: 3.2vw; top: 25vh; bottom: 9vh; width: min(41vw, 780px); padding: 16px 18px; overflow: hidden; z-index: 3; display: flex; flex-direction: column; justify-content: flex-end;
    font: 400 clamp(11px, 1.02vw, 16.5px)/1.5 "SF Mono", ui-monospace, Menlo, monospace; color: #3a3828; }
  #log .task { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; font-size: 1.12em; color: #46432f; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(90, 80, 50, 0.16); }
  #log div.e { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: in 0.18s ease-out; }
  #log .t { display: inline-block; width: 4.6em; color: #5d6b22; font-weight: 600; } #log .solve .t { color: #b55a08; }
  #log .dim { color: #8a8468; } #log .bad { color: #b0431c; } #log .good { color: #46521a; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  #tally { position: fixed; right: 3.2vw; top: 4.5vh; z-index: 3; padding: 18px 24px; min-width: 22vw; }
  #tally .big { font-size: clamp(44px, 6.2vw, 104px); font-weight: 200; letter-spacing: -0.03em; line-height: 0.95; font-variant-numeric: tabular-nums; }
  #tally .big small { font-size: 0.3em; color: var(--ink-soft); letter-spacing: 0; margin-left: 6px; }
  #tally .lab { font-size: clamp(12px, 1.15vw, 17px); color: var(--ink-soft); margin-top: 4px; }
  #tally .row { display: flex; gap: 22px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(90, 80, 50, 0.14); font-size: clamp(12px, 1.1vw, 16px); }
  #tally .row b { display: block; font-weight: 400; font-size: 1.25em; font-variant-numeric: tabular-nums; } #tally .row span { color: var(--ink-soft); font-size: 0.85em; }
  #foot { position: fixed; left: 3.2vw; right: 3.2vw; bottom: 2.2vh; font-size: 11.5px; letter-spacing: 0.03em; color: rgba(60, 55, 35, 0.7); z-index: 3; display: flex; justify-content: space-between; }
  @media (max-aspect-ratio: 1/1) {
    #head { left: 5vw; top: 3vh; } #tally { left: 5vw; right: 5vw; top: 13.5vh; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; align-items: end; }
    #tally .row { grid-column: 1 / 3; margin-top: 8px; padding-top: 8px; }
    #log { left: 5vw; right: 5vw; width: auto; top: auto; bottom: 5vh; height: 27vh; font-size: clamp(10px, 2.5vw, 15px); }
    #foot { flex-direction: column; font-size: 10px; }
  }
</style>
</head>
<body>
<iframe id="tunnel" src="index.html?embed=1&noengine=1"></iframe>
<div id="head"><h2>Fable 5.2 designs.<br>SoarLabs checks.</h2><p id="sub"></p></div>
<section id="log" class="glass"></section>
<section id="tally" class="glass">
  <div><div class="big"><span id="best">–</span><small>kg</small></div><div class="lab" id="bestlab">best position verified by the solver</div></div>
  <div class="row"><div><b id="scr">0</b><span>positions screened</span></div><div><b id="sol">0</b><span>solver runs</span></div><div><b id="base">–</b><span>standing</span></div></div>
</section>
<div id="foot"><span>replay of a real session · simple body · simulated tunnel</span><span id="speed"></span></div>
<script type="module">
const qs = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const S = (window.__wm = { done: false, errors: [], frames: 100 });
const run = await (await fetch(qs.get('run') || 'models/agent_run.json')).json();
const total = Number(qs.get('secs') || 11), lead = Number(qs.get('lead') || 1.2);
const frame = $('tunnel');
const kg = (v) => (v == null ? '–' : v.toFixed(1));
$('sub').textContent = `Claude ${run.model === 'claude-fable-5-2' ? 'Fable 5.2' : run.model} in Claude Code · tools over MCP: check, search, solve, learn`;
$('speed').textContent = `the session took ${Math.round(run.wall_s / 60)} min · shown ${Math.round(run.wall_s / total)}× faster`;
const log = $('log');
const task = document.createElement('div'); task.className = 'task'; task.textContent = run.task.replace(/^Task:\s*/, '“') + '”'; log.appendChild(task);
const add = (cls, html) => { const d = document.createElement('div'); d.className = 'e ' + cls; d.innerHTML = html; log.appendChild(d); while (log.children.length > 15) log.children[1].remove(); };
const num = (n) => n.toLocaleString('en-US');
let scr = 0;
function play(e) {
  if (e.tool === 'search') add('', `<span class="t">search</span>${num(e.n)} positions <span class="dim">→ ${num(e.ok)} allowed, sure of ${num(e.sure)} ·</span> best sure ${kg(e.best_sure_kg)} kg <span class="dim">· best unsure ${kg(e.best_unsure_kg)} kg</span>`);
  else if (e.tool === 'check') add('', `<span class="t">check</span>${e.n} position${e.n === 1 ? '' : 's'}`);
  else if (e.tool === 'solve') {
    add('solve', `<span class="t">solve</span>run ${e.k}: <b>${kg(e.solver_kg)} kg</b> <span class="dim">· model had said ${kg(e.model_kg)} kg,</span> <span class="${e.sure ? 'good' : 'bad'}">${e.sure ? 'sure' : 'not sure'} (±${e.bound_pct.toFixed(0)}%)</span>`);
    frame.contentWindow.postMessage({ type: 'wm-pose', pose: e.pose, body: e.body }, '*');
    $('sol').textContent = e.k; if (e.base_kg != null) $('base').textContent = kg(e.base_kg) + ' kg'; if (e.best_kg != null) $('best').textContent = kg(e.best_kg);
  } else if (e.tool === 'learn') add('', `<span class="t">learn</span>${e.n} solver run${e.n === 1 ? '' : 's'} <span class="dim">→ model now built on ${num(e.runs)} runs</span>`);
  else if (e.tool === 'render') add('', `<span class="t">render</span><span class="dim">final position</span>`);
  const to = e.screened, from = scr; scr = to; const t0 = performance.now();
  const tick = (now) => { const k = Math.min((now - t0) / 300, 1); $('scr').textContent = num(Math.round(from + (to - from) * k)); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
const step = (total * 1000) / run.events.length;
frame.addEventListener('load', () => setTimeout(() => {
  run.events.forEach((e, i) => setTimeout(() => play(e), i * step));
  setTimeout(() => {
    const bestEv = run.events.filter((e) => e.tool === 'solve' && e.k > 1).sort((a, b) => a.solver_kg - b.solver_kg)[0];
    if (bestEv) frame.contentWindow.postMessage({ type: 'wm-pose', pose: bestEv.pose, body: bestEv.body }, '*');
    $('bestlab').textContent = 'verified by the solver'; S.done = true;
  }, total * 1000 + 300);
}, lead * 1000));
</script>
</body>
</html>
